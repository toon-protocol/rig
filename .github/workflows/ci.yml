name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changeset:
    name: Changeset check
    runs-on: ubuntu-latest
    # Only meaningful on PRs; push-to-main runs after merge so skip there.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require changeset when the publishable package changes
        run: |
          # @toon-protocol/rig is published; rig-web is private (deployed, not published).
          PUBLISHABLE="packages/rig"
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          needs_changeset=false
          for pkg in $PUBLISHABLE; do
            if echo "$changed" | grep -q "^${pkg}/"; then
              needs_changeset=true
              break
            fi
          done
          if [ "$needs_changeset" = "true" ]; then
            new_changesets=$(echo "$changed" | grep -c "^\.changeset/.*\.md$" || true)
            if [ "$new_changesets" -eq 0 ]; then
              echo "::error::This PR modifies a publishable package but includes no changeset."
              echo "Run 'pnpm changeset' and commit the generated .changeset/*.md file."
              exit 1
            fi
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Record gate start time
        id: gate_start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      # Shared pnpm/Node + install steps, extracted into a reusable composite
      # action (issue #10). Checkout stays above because a local `./`-action
      # can't be resolved until the repo is on disk.
      - uses: ./.github/actions/setup-workspace

      # Unit tests for the gate scripts themselves (not covered by
      # `pnpm -r test`, since .sandcastle isn't a workspace package).
      - run: npx tsx --test .sandcastle/gate/*.test.ts

      # Runs eslint + typecheck and fails only on violations beyond the
      # frozen .sandcastle/gate-baseline.json allowlist (ADR-0001). Replaces
      # the old `pnpm lint` step, which had `continue-on-error: true` and
      # silently masked lint failures as green CI (a false-PASS hole) while
      # never gating typecheck at all.
      - run: npx tsx .sandcastle/gate/correctness.ts

      - run: pnpm -r build

      - run: pnpm -r test --if-present

      # No-regression guard: fails if gate wall-clock / runner-minutes
      # regress beyond a tolerance of the frozen baseline. Reads only the
      # frozen baseline numbers (never a live threshold) so the same commit
      # always earns the same verdict.
      - name: Speed/performance no-regression guard
        run: |
          end=$(date +%s)
          export GATE_WALL_CLOCK_SECONDS=$((end - ${{ steps.gate_start.outputs.start }}))
          npx tsx .sandcastle/gate/regression.ts

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [changeset, build]
    if: always()
    steps:
      # Fleet-wide aggregate required check per toon-meta#279: this single job
      # is the repo's one required status. A skipped or cancelled gating job
      # must never read as a pass, so each needed result is checked explicitly.
      # `changeset` is skipped BY DESIGN on push events only (its `if:` gates
      # it to pull_request); on PRs it must actually succeed.
      - name: Verify all gating jobs succeeded
        run: |
          echo "event:     ${{ github.event_name }}"
          echo "changeset: ${{ needs.changeset.result }}"
          echo "build:     ${{ needs.build.result }}"

          ok=true

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::build did not succeed (result: ${{ needs.build.result }})"
            ok=false
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # On PRs the changeset check always runs; skipped/cancelled/failure all fail.
            if [ "${{ needs.changeset.result }}" != "success" ]; then
              echo "::error::changeset did not succeed on a pull_request event (result: ${{ needs.changeset.result }})"
              ok=false
            fi
          else
            # On push events 'skipped' is the expected legitimate outcome ('success' also fine).
            case "${{ needs.changeset.result }}" in
              success|skipped) ;;
              *)
                echo "::error::changeset failed on a ${{ github.event_name }} event (result: ${{ needs.changeset.result }})"
                ok=false
                ;;
            esac
          fi

          [ "$ok" = "true" ] || exit 1
          echo "All gating jobs green."
