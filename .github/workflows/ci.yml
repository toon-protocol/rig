name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changeset:
    name: Changeset check
    runs-on: ubuntu-latest
    # Only meaningful on PRs; push-to-main runs after merge so skip there.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require changeset when the publishable package changes
        run: |
          # @toon-protocol/rig is published to npm; rig-web is not an npm package.
          PUBLISHABLE="packages/rig"
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          needs_changeset=false
          for pkg in $PUBLISHABLE; do
            if echo "$changed" | grep -q "^${pkg}/"; then
              needs_changeset=true
              break
            fi
          done
          if [ "$needs_changeset" = "true" ]; then
            new_changesets=$(echo "$changed" | grep -c "^\.changeset/.*\.md$" || true)
            if [ "$new_changesets" -eq 0 ]; then
              echo "::error::This PR modifies a publishable package but includes no changeset."
              echo "Run 'pnpm changeset' and commit the generated .changeset/*.md file."
              exit 1
            fi
          fi

      # The step above asserts only that a `.changeset/*.md` FILE EXISTS. It
      # never parses one, so a changeset that is well-formed YAML but an invalid
      # RELEASE PLAN passes it, and `release.yml` — which runs after merge, where
      # its failure gates nothing — is the first thing to read the file.
      #
      # toon-client had the byte-identical job, and that is exactly what happened
      # there (toon-client#611): a changeset naming both `@toon-protocol/client`
      # and the `ignore`d `@toon-protocol/client-mcp` merged, `changeset version`
      # refuses a changeset that mixes ignored and non-ignored packages, and
      # `release.yml` was red on EVERY push to main for a day — so no fix could
      # reach npm. Because `changeset version` stops at the first offender, FIVE
      # such changesets had piled up behind that error before anyone looked.
      #
      # This repo has the same shape and the same exposure:
      # `.changeset/config.json` lists `@toon-protocol/rig-web` in `ignore`, so
      # one hand-written changeset naming both it and `@toon-protocol/rig` would
      # wedge releases here the same way. Nothing is wrong today — both pending
      # changesets name only `@toon-protocol/rig` — so this is the guard ported
      # BEFORE it is needed rather than after.
      #
      # `changeset version` rather than `changeset status`: it is the
      # byte-identical command `release.yml`'s `changesets/action` runs as its
      # `version:` input, so green here means the release gets past versioning,
      # with no second implementation to drift. `status` additionally resolves
      # `baseBranch` through git and errors when IT decides packages changed with
      # no changeset — duplicating the step above with a different definition of
      # "changed". Mutating the tree is free: this job is a throwaway checkout
      # that commits, pushes and publishes nothing, and has no later steps.
      - uses: ./.github/actions/setup-workspace

      - name: Assert the changesets form a valid release plan
        run: |
          set -euo pipefail
          pnpm changeset version
          echo "--- the release plan this PR would produce ---"
          git --no-pager diff --stat
          echo "✅ changeset version succeeds — release.yml can get past versioning"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Record gate start time
        id: gate_start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      # Shared pnpm/Node + install steps, extracted into a reusable composite
      # action (issue #10). Checkout stays above because a local `./`-action
      # can't be resolved until the repo is on disk.
      - uses: ./.github/actions/setup-workspace

      # Unit tests for the gate scripts themselves (not covered by
      # `pnpm -r test`, since .sandcastle isn't a workspace package).
      - run: npx tsx --test .sandcastle/gate/*.test.ts

      # Runs eslint + typecheck and fails only on violations beyond the
      # frozen .sandcastle/gate-baseline.json allowlist (ADR-0001). Replaces
      # the old `pnpm lint` step, which had `continue-on-error: true` and
      # silently masked lint failures as green CI (a false-PASS hole) while
      # never gating typecheck at all.
      - run: npx tsx .sandcastle/gate/correctness.ts

      - run: pnpm -r build

      - run: pnpm -r test --if-present

      # No-regression guard: fails if gate wall-clock / runner-minutes
      # regress beyond a tolerance of the frozen baseline. Reads only the
      # frozen baseline numbers (never a live threshold) so the same commit
      # always earns the same verdict.
      - name: Speed/performance no-regression guard
        run: |
          end=$(date +%s)
          export GATE_WALL_CLOCK_SECONDS=$((end - ${{ steps.gate_start.outputs.start }}))
          npx tsx .sandcastle/gate/regression.ts

  # Fleet no-op merge guard (toon-meta#405), wired INTO this repo's aggregate
  # required check so that it blocks a HUMAN merge and not just the fleet
  # auto-merge pass (toon-meta#408). connector#1008 merged green, closed its
  # ticket and changed zero files -- and it was a human who merged it, because
  # a red NON-required check is only a warning on the merge button. This
  # replaces the stand-alone empty-pr-guard-shim.yml, deleted in the same
  # commit; running both would put two identical "No-op merge guard" check
  # runs on every PR. Canonical caller snippet and full rationale:
  # toon-meta scripts/factory/empty-pr-guard-gate-job.yml.
  #
  # No `secrets: inherit` -- the guard makes no API call and no write of any
  # kind, so handing it FACTORY_OPS_TOKEN would widen a monitored credential
  # for nothing. No `if:` either: this workflow also runs on push, where the
  # guard passes with a plain "no merge result to evaluate"; a job-level `if:`
  # would make it `skipped` there, and a skipped gating job must never read as
  # a pass (toon-meta#279).
  no-op-merge:
    uses: toon-protocol/toon-meta/.github/workflows/empty-pr-guard.yml@main

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [changeset, build, no-op-merge]
    if: always()
    steps:
      # Fleet-wide aggregate required check per toon-meta#279: this single job
      # is the repo's one required status. A skipped or cancelled gating job
      # must never read as a pass, so each needed result is checked explicitly.
      # `changeset` is skipped BY DESIGN on push events only (its `if:` gates
      # it to pull_request); on PRs it must actually succeed.
      - name: Verify all gating jobs succeeded
        run: |
          echo "event:     ${{ github.event_name }}"
          echo "changeset: ${{ needs.changeset.result }}"
          echo "build:     ${{ needs.build.result }}"
          echo "no-op:     ${{ needs.no-op-merge.result }}"

          ok=true

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::build did not succeed (result: ${{ needs.build.result }})"
            ok=false
          fi

          # The no-op merge guard runs on every event and passes on push
          # with "no merge result to evaluate", so it is unconditional here.
          if [ "${{ needs.no-op-merge.result }}" != "success" ]; then
            echo "::error::no-op merge guard did not succeed (result: ${{ needs.no-op-merge.result }}) — merging this PR would change nothing"
            ok=false
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # On PRs the changeset check always runs; skipped/cancelled/failure all fail.
            if [ "${{ needs.changeset.result }}" != "success" ]; then
              echo "::error::changeset did not succeed on a pull_request event (result: ${{ needs.changeset.result }})"
              ok=false
            fi
          else
            # On push events 'skipped' is the expected legitimate outcome ('success' also fine).
            case "${{ needs.changeset.result }}" in
              success|skipped) ;;
              *)
                echo "::error::changeset failed on a ${{ github.event_name }} event (result: ${{ needs.changeset.result }})"
                ok=false
                ;;
            esac
          fi

          [ "$ok" = "true" ] || exit 1
          echo "All gating jobs green."
