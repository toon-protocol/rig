name: Deploy rig-web

# Builds packages/rig-web and deploys it to GitHub Pages
# (https://toon-protocol.github.io/rig/) on every push to main that touches the
# web app, plus manual dispatch.
#
# Two build-time details matter and are handled below:
#   * VITE_DEFAULT_RELAY is inlined by Vite AT BUILD TIME (not read at serve
#     time), so it must be set on the build step or the app falls back to the
#     baked-in localhost default and can't reach the network.
#   * --base=/rig/ rewrites asset URLs for the project-pages subpath (the site is
#     served under /rig/, not the domain root). The app uses hash routing (#/...),
#     so no SPA 404.html fallback is needed.

on:
  push:
    branches: [main]
    # Deliberately not narrowed to packages/rig-web/**: rig-web embeds
    # @toon-protocol/rig, so a rig-only change (including a changeset
    # release commit) can change rig-web's runtime behavior and must still
    # redeploy. This means every rig release commit also triggers a Pages
    # deploy even when no web code changed; now that runs queue instead of
    # cancel (see the concurrency block below), that's a harmless extra
    # deploy rather than a source of collisions (toon-protocol/rig#32).
    paths:
      - 'packages/rig-web/**'
      - 'packages/rig/**'
      - '.github/workflows/deploy-rig-web.yml'
  workflow_dispatch:

# Least privilege for the Pages deployment (GITHUB_TOKEN OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; queue rather than cancel. Cancelling the
# *workflow run* does not cancel the *API-side deployment* it already
# created, so killing a run mid-flight orphans a stale "in progress" lock
# that then 400s the next deploy (toon-protocol/rig#32). Let each run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      # Build all workspace packages in dependency order so rig-web's internal
      # workspace dep (@toon-protocol/rig) is present, then rebuild ONLY rig-web
      # with the Pages base + devnet relay baked in.
      - run: pnpm -r build

      - name: Build rig-web for Pages
        env:
          VITE_DEFAULT_RELAY: wss://relay-ws.devnet.toonprotocol.dev
        run: |
          pnpm --filter @toon-protocol/rig-web exec vite build --base=/rig/
          touch packages/rig-web/dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/rig-web/dist

      # The Pages API can hold a stale "in progress" lock on the previous
      # deployment for a few minutes after that run reported success,
      # 400ing the very next deploy (toon-protocol/rig#32). One retry
      # after a short wait is enough to clear a transient stale lock
      # without masking a real, persistent deploy failure.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying a failed Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Retry Pages deployment (transient stale-lock tolerance)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
